  <text x="920" y="2142" font-size="18" font-weight="bold" fill="#0f172a">old → old: 概念上は不要</text>
  <text x="920" y="2168" font-size="15.5" fill="#475569">実装は armed old への格納で子の世代を見ずに発火(無害な過剰近似)</text>
