[workspace]
members = ["monoruby", "monoruby_attr", "monoruby_ext_sys", "monoruby_ext", "ext/sqlite3", "ext/zlib", "ext/zstd", "ext/psych", "ext/nokogiri", "rubymap", "hashbrown", "ruby_traits", "libxml2-src", "libsqlite3-src"]
resolver = "2"

[profile.dev]
opt-level = 1

# Build-dependencies are built with `build-override`, whose opt-level is 0
# even in release. The extension cdylibs are build-dependencies of monoruby
# (artifact dependencies, installed by its build.rs), so give them the
# release opt-level — they are what `cargo install` puts in `ext/`.
[profile.release.build-override]
opt-level = 3
