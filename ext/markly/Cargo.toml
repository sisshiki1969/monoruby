[package]
name = "markly_native"
version = "0.1.0"
edition = "2024"
description = "The markly gem's native half for monoruby (cmark-gfm's parser and renderers), as a dynamically loaded extension over comrak"
license = "MIT"
publish = false

[lib]
name = "markly_native"
crate-type = ["cdylib"]

[dependencies]
monoruby-ext = { path = "../../monoruby_ext" }
comrak = { version = "0.55", default-features = false }
