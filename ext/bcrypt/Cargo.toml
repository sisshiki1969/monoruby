[package]
name = "bcrypt_native"
version = "0.1.0"
edition = "2024"
description = "The bcrypt gem's native half for monoruby, as a dynamically loaded extension over the bcrypt crate"
license = "MIT"
publish = false

[lib]
name = "bcrypt_native"
crate-type = ["cdylib"]

[dependencies]
monoruby-ext = { path = "../../monoruby_ext" }
bcrypt = "0.19"
