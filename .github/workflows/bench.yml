name: bench vs YJIT

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which benchmark jobs to run"
        type: choice
        default: arm64
        options:
          - arm64
          - amd64
          - both
  # Every crate that ends up in the measured binary or in an extension
  # it dlopens, plus what decides how they are built. `ruruby-parse` is
  # gone (prism replaced it) and the extensions were missing entirely,
  # so a change confined to `ext/` — where the interpreter's native
  # halves now live — used to merge without ever being benchmarked.
  push:
    branches: [master]
    paths:
      - 'monoruby/**'
      - 'monoruby_attr/**'
      - 'monoruby_ext/**'
      - 'monoruby_ext_sys/**'
      - 'ext/**'
      - 'hashbrown/**'
      - 'rubymap/**'
      - 'ruby_traits/**'
      - 'libxml2-src/**'
      - 'libsqlite3-src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - '.github/workflows/bench.yml'
      - '.github/scripts/**'
      - '.github/portal/**'
      - '.github/bench-pages/**'

permissions:
  contents: write
  # `gate` reads this workflow's own run history to detect a bench run
  # already in flight. Naming `contents` above drops every other scope
  # to none, so the read has to be asked for.
  actions: read

jobs:
  # Whether the benchmark jobs run, decided in a job of its own because
  # the answer needs an API call. Every master push benchmarks both
  # architectures — unless a bench run is already underway, in which
  # case this job FAILS (exit 1): the push's run goes red instead of
  # starting a second pass alongside one still measuring wall-clock
  # time on a shared runner. The next push after the running pass
  # finishes benchmarks again. A manual dispatch is a human's explicit
  # ask and bypasses the check (the per-job concurrency groups below
  # still keep two same-kind passes from overlapping).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      amd64: ${{ steps.decide.outputs.amd64 }}
      arm64: ${{ steps.decide.outputs.arm64 }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          set -uo pipefail

          amd64=false
          arm64=false
          reason=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "${ARCH:-}" in
              amd64) amd64=true ;;
              arm64) arm64=true ;;
              both)  amd64=true; arm64=true ;;
            esac
            reason="dispatched with arch=${ARCH:-unset}"
          else
            # Other runs of this workflow still queued or running, this
            # one aside. Only *older* runs (smaller id) count: of two
            # pushes racing through this check, the older never defers
            # to the newer, so exactly one of them proceeds instead of
            # each seeing the other and both stopping.
            busy=$(gh api \
              "repos/$REPO/actions/workflows/bench.yml/runs?per_page=50" \
              --jq "[.workflow_runs[]
                     | select(.id < $RUN_ID
                              and (.status == \"queued\" or .status == \"in_progress\"))]
                    | length" 2>/dev/null || echo "")

            if [ -n "$busy" ] && [ "$busy" -gt 0 ]; then
              msg="a bench run is already in flight ($busy queued/running) — failing this one"
              echo "$msg"
              echo "**FAILED**: $msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            amd64=true
            arm64=true
            if [ -z "$busy" ]; then
              # The API would not answer. Benchmark rather than silently
              # stop doing so.
              reason="run-list query failed — proceeding"
            else
              reason="no other bench run in flight"
            fi
          fi

          {
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"
          echo "bench-amd64: **$amd64**, bench-arm64: **$arm64** — $reason" >> "$GITHUB_STEP_SUMMARY"
          echo "bench-amd64: $amd64, bench-arm64: $arm64 — $reason"

  bench-amd64:
    # Runs on every master push, unless `gate` failed the run because a
    # bench run was already in flight; a manual dispatch includes it
    # only when asked (arch: amd64 / both).
    needs: gate
    if: ${{ needs.gate.outputs.amd64 == 'true' }}
    # One at a time, per architecture. These jobs measure wall-clock
    # time on shared GitHub runners, so two of the same kind in flight
    # are two benchmarks competing for one CPU — which is what made
    # adjacent commits in the portal's history differ by a factor of two
    # in absolute milliseconds. The group is per job rather than per
    # workflow so the daily macOS pass, which takes ~4 h, does not hold
    # the Linux one behind it: they run on different machines and do not
    # compete. `cancel-in-progress: false` — a job that has already
    # started is worth finishing, since throwing away hours of
    # measurement to begin it again from the top gains nothing.
    concurrency:
      group: bench-amd64-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps for yjit-bench and the ruby HEAD build
        # libssl-dev/zlib1g-dev/libffi-dev are for the ruby HEAD build
        # (rubygems needs openssl+zlib so each benchmark's
        # `bundle install` works under the zjit ruby); autoconf drives
        # its autogen.sh. The rest are yjit-bench gem dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagickwand-dev imagemagick libsqlite3-dev libpq-dev libyaml-dev \
            autoconf libssl-dev zlib1g-dev libffi-dev

      - name: Install monoruby (release)
        run: RUSTFLAGS=-Cforce-frame-pointers cargo install --path monoruby --locked

      - name: Compute the daily ruby HEAD cache key
        id: zjit-key
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the ruby HEAD (ZJIT) build cache
        # Full ruby/ruby builds are limited to one per day: the cache key
        # carries the UTC date, so the first bench run of a day builds
        # HEAD and every later run that day restores it in seconds. The
        # prefix restore-key falls back to the newest older build, so a
        # day whose ruby/ruby master fails to build still benchmarks
        # zjit — on yesterday's HEAD, which the dashboard reports
        # faithfully because the sha is read from the binary itself
        # (see "Resolve the zjit engine"). The post-job save stores
        # whatever prefix the run ends with under *today's* key, so a
        # failed build is not retried until tomorrow: at most one full
        # build per day, by construction.
        id: zjit-cache
        uses: actions/cache@v4
        with:
          path: ~/ruby-head
          key: ruby-head-zjit-${{ runner.os }}-${{ runner.arch }}-${{ steps.zjit-key.outputs.today }}
          restore-keys: |
            ruby-head-zjit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ruby HEAD (ZJIT)
        # Only on the day's first run (no exact cache hit). master does
        # occasionally fail to build — that must not cost the monoruby /
        # YJIT numbers, so this step only drops the zjit engine on
        # failure, and a restored older build survives it: the install
        # prefix is wiped only after `make` has succeeded. The nightly
        # Rust toolchain installed above satisfies ZJIT's rustc >= 1.85
        # requirement; the 4.0.6 ruby installed above is BASERUBY.
        id: zjit
        if: steps.zjit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ruby/ruby.git ../ruby-head
          cd ../ruby-head
          ./autogen.sh
          ./configure --prefix="$HOME/ruby-head" \
            --enable-zjit --disable-yjit --disable-install-doc
          make -j"$(getconf _NPROCESSORS_ONLN)"
          rm -rf "$HOME/ruby-head"
          make install

      - name: Resolve the zjit engine
        # The binary answers for itself whether zjit is usable and which
        # ruby/ruby commit it was built from — the same contract whether
        # it was built just now, restored from today's cache, or fell
        # back to an older day's build.
        id: zjit-resolved
        shell: bash
        run: |
          ok=false; sha=""
          if [ -x "$HOME/ruby-head/bin/ruby" ] \
            && sha=$("$HOME/ruby-head/bin/ruby" --zjit -e 'print RUBY_REVISION[0, 7]' 2>/dev/null); then
            ok=true
            "$HOME/ruby-head/bin/ruby" --zjit -e 'puts RUBY_DESCRIPTION'
          fi
          { echo "ok=$ok"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

      - name: Clone yjit-bench (Shopify/yjit-bench)
        run: git clone --depth 1 https://github.com/Shopify/yjit-bench.git ../ruby-bench

      - name: Patch yjit-bench to record per-benchmark exit codes
        working-directory: ../ruby-bench
        run: |
          ruby - <<'RUBY'
          file = "lib/benchmark_runner/cli.rb"
          src = File.read(file)
          unless src.include?("failures.json")
            insert = '      File.write("#{output_path}.failures.json", JSON.generate(bench_failures))' + "\n\n"
            patched = src.sub(/(^      # Save the output in a text file)/) { insert + $1 }
            raise "could not locate insertion point" if patched == src
            File.write(file, patched)
            puts "patched: writes <output_path>.failures.json"
          end
          RUBY

      - name: bundle install yjit-bench
        working-directory: ../ruby-bench
        run: |
          gem install --no-document bundler
          bundle install || true

      - name: Pre-run resource snapshot
        run: |
          echo "## Pre-run resource snapshot"
          { echo '### df -h'; df -h; echo; echo '### free -h'; free -h; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run yjit-bench (monoruby vs ruby --yjit / --zjit)
        id: run
        working-directory: ../ruby-bench
        shell: bash
        env:
          # One `timeout(1)` per engine (see the -e definitions below),
          # so each benchmark gets this many seconds of wall clock. Equal
          # across the three engines: they are compared, so they are
          # measured under the same rule.
          MR_TIMEOUT: '1000'
          YJ_TIMEOUT: '1000'
          ZJ_TIMEOUT: '1000'
          # The convergence rule. harness-warmup iterates until its
          # median absolute deviation falls under a threshold that
          # *relaxes* as it goes — `MAD_TARGET + (iters - MIN_ITERS) *
          # MAD_INCREASE_PER_ITER` — so a noisy benchmark converges late
          # rather than never.
          #
          # The defaults (0.001, +0.0001) ask for 0.1% and give a point
          # back every iteration, which is a reasonable target on a quiet
          # machine and an unreachable one here: a shared GitHub runner,
          # with several of these jobs in flight at once, is not where a
          # 0.1% median is going to be established by sitting still for
          # longer. splay is the extreme — its bimodal GC holds its MAD
          # at ~0.434, which the default ramp only reaches around
          # iteration 4,300 (~520 s) — but every benchmark was paying the
          # same way, running hundreds of iterations to chase a precision
          # the environment cannot deliver.
          #
          # So aim for 2% and give 2 points back per iteration: the
          # benchmarks that are steady still settle at MIN_ITERS, and the
          # ones that are not stop within ~20 iterations instead of
          # thousands. MIN_ITERS (10) and MIN_TIME (5 s), both left at
          # their defaults, are what now set the floor — a fast benchmark
          # still runs hundreds of iterations to fill its 5 seconds.
          MAD_TARGET: '0.02'
          MAD_INCREASE_PER_ITER: '0.02'
          # harness-warmup's own ceiling, deliberately *below* the
          # timeouts above, so a benchmark that somehow still has not
          # converged is ended by the harness — with the median it has —
          # rather than killed by `timeout(1)`, which records
          # `timeout (Ns)` and no measurement at all.
          MAX_TIME: '600'
          ZJIT_OK: ${{ steps.zjit-resolved.outputs.ok }}
        run: |
          set +e
          set -uo pipefail

          OUT="$GITHUB_WORKSPACE/bench-results"
          mkdir -p "$OUT/data"

          # The zjit engine rides on the resolved HEAD build; "$@"
          # expands to nothing (safely, even under `set -u` on old bash)
          # when no usable build exists and the run proceeds two-engined.
          if [ "${ZJIT_OK:-false}" = "true" ]; then
            set -- -e "zjit::timeout --foreground -k 5 ${ZJ_TIMEOUT} $HOME/ruby-head/bin/ruby --zjit"
          else
            set --
          fi

          ./run_benchmarks.rb \
            --no-sudo \
            --no-pinning \
            --rss \
            --harness=harness-warmup \
            --out_path="$OUT/data" \
            --out-name="$OUT/data/raw" \
            -e "monoruby::timeout --foreground -k 5 ${MR_TIMEOUT} $HOME/.cargo/bin/monoruby" \
            -e "yjit::timeout --foreground -k 5 ${YJ_TIMEOUT} $(command -v ruby) --yjit" \
            "$@" \
            2>&1 | tee "$OUT/run.log"

          true

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          {
            echo "timestamp=$TIMESTAMP"
            echo "short_sha=$SHORT_SHA"
            echo "mr_timeout=${MR_TIMEOUT}"
            echo "yj_timeout=${YJ_TIMEOUT}"
            echo "zj_timeout=${ZJ_TIMEOUT}"
          } >> "$GITHUB_OUTPUT"

      - name: Post-run resource snapshot
        if: always()
        run: |
          echo "## Post-run resource snapshot"
          { echo '### df -h'; df -h; echo; echo '### free -h'; free -h; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Aggregate to portal JSON
        env:
          TIMESTAMP: ${{ steps.run.outputs.timestamp }}
          SHORT_SHA: ${{ steps.run.outputs.short_sha }}
          MR_TIMEOUT: ${{ steps.run.outputs.mr_timeout }}
          YJ_TIMEOUT: ${{ steps.run.outputs.yj_timeout }}
          ZJ_TIMEOUT: ${{ steps.run.outputs.zj_timeout }}
          RUBY_HEAD_SHA: ${{ steps.zjit-resolved.outputs.sha }}
          ZJIT_BUILD: ${{ steps.zjit-resolved.outputs.ok == 'true' && 'ok' || 'failed' }}
        shell: bash
        run: |
          set -euo pipefail

          ruby "$GITHUB_WORKSPACE/.github/scripts/aggregate_portal.rb" \
            > "$GITHUB_WORKSPACE/bench-results/portal.json"

          {
            echo "## Benchmark vs YJIT / ZJIT (yjit-bench, x86-64)"
            echo ""
            echo "monoruby commit: \`$SHORT_SHA\`  zjit: ruby/ruby@\`${RUBY_HEAD_SHA:-n/a}\` (timeouts: monoruby ${MR_TIMEOUT}s, yjit ${YJ_TIMEOUT}s, zjit ${ZJ_TIMEOUT}s)"
            echo ""
            echo "| Benchmark | monoruby (ms) | YJIT (ms) | ZJIT (ms) | monoruby (x YJIT) | ZJIT (x YJIT) | reasons |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | --- |"
            ruby "$GITHUB_WORKSPACE/.github/scripts/summary_rows.rb"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-amd64
          path: bench-results/
          retention-days: 30

  bench-arm64:
    # Runs on every master push, like bench-amd64, unless `gate` failed
    # the run because a bench run was already in flight; a manual
    # dispatch includes it only when asked (arch: arm64 — the dispatch
    # default — or both).
    needs: gate
    if: ${{ needs.gate.outputs.arm64 == 'true' }}
    # One at a time, per architecture. These jobs measure wall-clock
    # time on shared GitHub runners, so two of the same kind in flight
    # are two benchmarks competing for one CPU — which is what made
    # adjacent commits in the portal's history differ by a factor of two
    # in absolute milliseconds. The group is per job rather than per
    # workflow so the daily macOS pass, which takes ~4 h, does not hold
    # the Linux one behind it: they run on different machines and do not
    # compete. `cancel-in-progress: false` — a job that has already
    # started is worth finishing, since throwing away hours of
    # measurement to begin it again from the top gains nothing.
    concurrency:
      group: bench-arm64-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    # The three-engine pass needs ~245-260 min on this runner (the zjit
    # pass alone is ~2.5 h on arm64) and has been known to reach this
    # cap on bad days, so take everything GitHub-hosted runners allow:
    # 360 minutes is the maximum.
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"

      - name: Install bigdecimal (no longer a default gem since Ruby 3.4)
        run: gem install bigdecimal --no-document

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps for yjit-bench and the ruby HEAD build (macOS)
        run: |
          brew install coreutils imagemagick sqlite libpq libyaml libffi pkg-config \
            autoconf automake openssl@3
          # GNU coreutils provides `timeout --foreground` used by the bench wrapper.
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install monoruby (release)
        run: cargo install --path monoruby --locked

      - name: Compute the daily ruby HEAD cache key
        id: zjit-key
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the ruby HEAD (ZJIT) build cache
        # Mirrors the amd64 job: at most one full ruby/ruby build per
        # UTC day, with a fallback to the newest older build when
        # today's master fails to build. See the amd64 job's comment
        # for the mechanics.
        id: zjit-cache
        uses: actions/cache@v4
        with:
          path: ~/ruby-head
          key: ruby-head-zjit-${{ runner.os }}-${{ runner.arch }}-${{ steps.zjit-key.outputs.today }}
          restore-keys: |
            ruby-head-zjit-${{ runner.os }}-${{ runner.arch }}-

      - name: Build ruby HEAD (ZJIT)
        # Only on the day's first run (no exact cache hit); a failed
        # ruby/ruby master build only drops the zjit engine, and a
        # restored older build survives it (the prefix is wiped only
        # after `make` has succeeded). openssl@3 is keg-only, so
        # configure is pointed at it explicitly (rubygems needs it for
        # each benchmark's `bundle install`).
        id: zjit
        if: steps.zjit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ruby/ruby.git ../ruby-head
          cd ../ruby-head
          ./autogen.sh
          ./configure --prefix="$HOME/ruby-head" \
            --enable-zjit --disable-yjit --disable-install-doc \
            --with-openssl-dir="$(brew --prefix openssl@3)"
          make -j"$(getconf _NPROCESSORS_ONLN)"
          rm -rf "$HOME/ruby-head"
          make install

      - name: Resolve the zjit engine
        # See the amd64 job: the binary answers for itself whether zjit
        # is usable and which ruby/ruby commit it was built from,
        # whichever of build / today's cache / older fallback provided it.
        id: zjit-resolved
        shell: bash
        run: |
          ok=false; sha=""
          if [ -x "$HOME/ruby-head/bin/ruby" ] \
            && sha=$("$HOME/ruby-head/bin/ruby" --zjit -e 'print RUBY_REVISION[0, 7]' 2>/dev/null); then
            ok=true
            "$HOME/ruby-head/bin/ruby" --zjit -e 'puts RUBY_DESCRIPTION'
          fi
          { echo "ok=$ok"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

      - name: Clone yjit-bench (Shopify/yjit-bench)
        run: git clone --depth 1 https://github.com/Shopify/yjit-bench.git ../ruby-bench

      - name: Patch yjit-bench to record per-benchmark exit codes
        working-directory: ../ruby-bench
        run: |
          ruby - <<'RUBY'
          file = "lib/benchmark_runner/cli.rb"
          src = File.read(file)
          unless src.include?("failures.json")
            insert = '      File.write("#{output_path}.failures.json", JSON.generate(bench_failures))' + "\n\n"
            patched = src.sub(/(^      # Save the output in a text file)/) { insert + $1 }
            raise "could not locate insertion point" if patched == src
            File.write(file, patched)
            puts "patched: writes <output_path>.failures.json"
          end
          RUBY

      - name: bundle install yjit-bench
        working-directory: ../ruby-bench
        run: |
          gem install --no-document bundler
          bundle install || true

      - name: Run yjit-bench (monoruby vs ruby --yjit / --zjit)
        id: run
        working-directory: ../ruby-bench
        shell: bash
        env:
          # One `timeout(1)` per engine (see the -e definitions below),
          # so each benchmark gets this many seconds of wall clock. Equal
          # across the three engines: they are compared, so they are
          # measured under the same rule.
          MR_TIMEOUT: '1000'
          YJ_TIMEOUT: '1000'
          ZJ_TIMEOUT: '1000'
          # The convergence rule. harness-warmup iterates until its
          # median absolute deviation falls under a threshold that
          # *relaxes* as it goes — `MAD_TARGET + (iters - MIN_ITERS) *
          # MAD_INCREASE_PER_ITER` — so a noisy benchmark converges late
          # rather than never.
          #
          # The defaults (0.001, +0.0001) ask for 0.1% and give a point
          # back every iteration, which is a reasonable target on a quiet
          # machine and an unreachable one here: a shared GitHub runner,
          # with several of these jobs in flight at once, is not where a
          # 0.1% median is going to be established by sitting still for
          # longer. splay is the extreme — its bimodal GC holds its MAD
          # at ~0.434, which the default ramp only reaches around
          # iteration 4,300 (~520 s) — but every benchmark was paying the
          # same way, running hundreds of iterations to chase a precision
          # the environment cannot deliver.
          #
          # So aim for 2% and give 2 points back per iteration: the
          # benchmarks that are steady still settle at MIN_ITERS, and the
          # ones that are not stop within ~20 iterations instead of
          # thousands. MIN_ITERS (10) and MIN_TIME (5 s), both left at
          # their defaults, are what now set the floor — a fast benchmark
          # still runs hundreds of iterations to fill its 5 seconds.
          MAD_TARGET: '0.02'
          MAD_INCREASE_PER_ITER: '0.02'
          # harness-warmup's own ceiling, deliberately *below* the
          # timeouts above, so a benchmark that somehow still has not
          # converged is ended by the harness — with the median it has —
          # rather than killed by `timeout(1)`, which records
          # `timeout (Ns)` and no measurement at all.
          #
          # Same budget as amd64, so the two dashboards measure under
          # the same rule. This job has little headroom under its
          # `timeout-minutes` cap (at 450 s, three of the seven daily
          # runs to 2026-09-20 were still cancelled at the cap), but a
          # cancelled run now costs much less than it did on the daily
          # cadence: the next master push simply benchmarks again
          # instead of leaving the whole day unpublished.
          MAX_TIME: '600'
          ZJIT_OK: ${{ steps.zjit-resolved.outputs.ok }}
        run: |
          set +e
          set -uo pipefail

          OUT="$GITHUB_WORKSPACE/bench-results"
          mkdir -p "$OUT/data"

          # See the amd64 job: "$@" carries the zjit engine only when a
          # usable HEAD build was resolved.
          if [ "${ZJIT_OK:-false}" = "true" ]; then
            set -- -e "zjit::timeout --foreground -k 5 ${ZJ_TIMEOUT} $HOME/ruby-head/bin/ruby --zjit"
          else
            set --
          fi

          ./run_benchmarks.rb \
            --no-sudo \
            --no-pinning \
            --rss \
            --harness=harness-warmup \
            --out_path="$OUT/data" \
            --out-name="$OUT/data/raw" \
            -e "monoruby::timeout --foreground -k 5 ${MR_TIMEOUT} $HOME/.cargo/bin/monoruby" \
            -e "yjit::timeout --foreground -k 5 ${YJ_TIMEOUT} $(command -v ruby) --yjit" \
            "$@" \
            2>&1 | tee "$OUT/run.log"

          true

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          {
            echo "timestamp=$TIMESTAMP"
            echo "short_sha=$SHORT_SHA"
            echo "mr_timeout=${MR_TIMEOUT}"
            echo "yj_timeout=${YJ_TIMEOUT}"
            echo "zj_timeout=${ZJ_TIMEOUT}"
          } >> "$GITHUB_OUTPUT"

      - name: Aggregate to portal JSON
        env:
          TIMESTAMP: ${{ steps.run.outputs.timestamp }}
          SHORT_SHA: ${{ steps.run.outputs.short_sha }}
          MR_TIMEOUT: ${{ steps.run.outputs.mr_timeout }}
          YJ_TIMEOUT: ${{ steps.run.outputs.yj_timeout }}
          ZJ_TIMEOUT: ${{ steps.run.outputs.zj_timeout }}
          RUBY_HEAD_SHA: ${{ steps.zjit-resolved.outputs.sha }}
          ZJIT_BUILD: ${{ steps.zjit-resolved.outputs.ok == 'true' && 'ok' || 'failed' }}
        shell: bash
        run: |
          set -euo pipefail

          ruby "$GITHUB_WORKSPACE/.github/scripts/aggregate_portal.rb" \
            > "$GITHUB_WORKSPACE/bench-results/portal.json"

          {
            echo "## Benchmark vs YJIT / ZJIT (yjit-bench, aarch64)"
            echo ""
            echo "monoruby commit: \`$SHORT_SHA\`  zjit: ruby/ruby@\`${RUBY_HEAD_SHA:-n/a}\` (timeouts: monoruby ${MR_TIMEOUT}s, yjit ${YJ_TIMEOUT}s, zjit ${ZJ_TIMEOUT}s)"
            echo ""
            echo "| Benchmark | monoruby (ms) | YJIT (ms) | ZJIT (ms) | monoruby (x YJIT) | ZJIT (x YJIT) | reasons |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | --- |"
            ruby "$GITHUB_WORKSPACE/.github/scripts/summary_rows.rb"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-arm64
          path: bench-results/
          retention-days: 30

  publish:
    needs: [bench-amd64, bench-arm64]
    # Run even if one benchmark job failed, so partial results are still
    # published — a failed job still uploads what it measured. Skip only
    # when neither job ran at all — a run `gate` failed because a bench
    # was already in flight, or a single-arch dispatch's other side:
    # there is nothing to publish and the last snapshot stands.
    if: ${{ always()
      && (needs.bench-amd64.result != 'skipped' || needs.bench-arm64.result != 'skipped')
      && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-amd64
          path: bench-results-amd64/

      - name: Download arm64 results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-arm64
          path: bench-results-arm64/

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          GH_PAGES_DIR="$RUNNER_TEMP/gh-pages"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages > /dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" "$GH_PAGES_DIR"
          else
            mkdir -p "$GH_PAGES_DIR"
            git -C "$GH_PAGES_DIR" init -b gh-pages
            git -C "$GH_PAGES_DIR" remote add origin "$REPO_URL"
          fi

          # publish_arch RESULTS_DIR GH_PAGES_SUBDIR
          publish_arch() {
            local RESULTS="$1"
            local SUBDIR="$2"

            if [ ! -f "$RESULTS/portal.json" ]; then
              echo "no portal.json for $SUBDIR — skipping"
              return
            fi

            mkdir -p "$GH_PAGES_DIR/$SUBDIR/data"

            local CSV="$GH_PAGES_DIR/$SUBDIR/data/history.csv"
            # New columns only ever go at the END of this header:
            # consumers parse rows positionally, and older rows keep
            # their original (shorter) field count.
            local HEADER="timestamp,commit,benchmark,monoruby_ms,yjit_ms,ratio,monoruby_failed,yjit_failed,monoruby_reason,yjit_reason,zjit_ms,zjit_failed,zjit_reason"

            if [ ! -f "$CSV" ]; then
              echo "$HEADER" > "$CSV"
            elif [ "$(head -n 1 "$CSV")" != "$HEADER" ]; then
              # A schema change (or the original stale monoruby_ips
              # header) leaves line 1 out of date; rewrite just that
              # line so the names match the current schema.
              { echo "$HEADER"; tail -n +2 "$CSV"; } > "$CSV.new"
              mv "$CSV.new" "$CSV"
              echo "history.csv: refreshed stale header for $SUBDIR"
            fi

            ruby "$GITHUB_WORKSPACE/.github/scripts/append_history.rb" \
              "$RESULTS/portal.json" >> "$GH_PAGES_DIR/$SUBDIR/data/history.csv"

            cp "$RESULTS/portal.json" "$GH_PAGES_DIR/$SUBDIR/latest.json"
            cp "$GITHUB_WORKSPACE/.github/bench-pages/index.html" "$GH_PAGES_DIR/$SUBDIR/index.html"
            echo "published $SUBDIR @ $(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0]))["timestamp"]' "$RESULTS/portal.json")"
          }

          publish_arch "$GITHUB_WORKSPACE/bench-results-amd64" "bench"
          publish_arch "$GITHUB_WORKSPACE/bench-results-arm64" "bench-arm64"

          cd "$GH_PAGES_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "bench: $(date -u +%Y-%m-%dT%H:%M:%SZ) (${GITHUB_SHA:0:7})"
            for i in 1 2 3 4; do
              if git push -u origin gh-pages; then
                break
              fi
              sleep $((2 ** i))
            done
          fi
