name: darwin hang debug

# Manual-only diagnostic for the intermittent arm64 hang that only reproduces on
# the macOS GitHub-hosted runner. The runner dies of memory exhaustion (OOM) —
# "lost communication" — before any stack can be captured, so the goal here is to
# cap memory *per test process* and catch the culprit BEFORE the runner dies.
#
# macOS does not reliably enforce `ulimit -v` (RLIMIT_AS), so the portable
# mechanism is a background MEMORY WATCHDOG: it polls every monoruby process's
# RSS and, when one exceeds RSS_LIMIT_KB (or the parallel sum exceeds
# SUM_LIMIT_KB), it records that process's command line (= the nextest test name
# / benchmark / spec it is running), `sample`s its stack, and kills it. nextest
# then reports that test as failed-by-signal (named), and bin/test's phase
# markers say which phase — so the memory culprit is identified instead of the
# whole runner OOM-dying. `mem_limit_kb` additionally tries `ulimit -v` (effective
# on Linux, usually a no-op on macOS; default off to avoid tripping monoruby's
# large virtual reservations).
#
# Runs the full bin/test in a loop (the configuration that actually reproduced),
# so the hang is caught whatever phase it strikes. Not wired to push/PR.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Max bin/test iterations before giving up"
        default: "8"
      test_threads:
        description: "nextest test threads (blank = default parallelism)"
        default: ""
      rss_limit_kb:
        description: "Per-process monoruby RSS cap (KB) — kill+sample above this"
        default: "4000000"
      sum_limit_kb:
        description: "Summed monoruby RSS cap (KB) — catch cumulative pressure"
        default: "5000000"
      mem_limit_kb:
        description: "ulimit -v per process (KB); 0 = off (macOS usually ignores it)"
        default: "0"

jobs:
  darwin-hang-debug:
    runs-on: macos-latest
    timeout-minutes: 180
    # checks: write lets the in-step heartbeat publish a
    # `darwin-hang-debug-heartbeat` check run that survives runner death.
    permissions:
      checks: write
      contents: read
    env:
      CARGO_TERM_COLOR: always
      SKIP_COV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.2"
      - name: Install bigdecimal (no longer a default gem since Ruby 3.4)
        run: gem install bigdecimal --no-document
      - name: Install ruby-bench gem dependencies
        run: gem install erubi --no-document
      - name: Install libffi + pkg-config
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@nextest
      - name: Clone optcarrot
        run: git clone https://github.com/mame/optcarrot.git ../optcarrot
      - name: Clone ruby/spec and mspec (pinned)
        env:
          SPEC_REV: baf5738ada1709afdbcf222c7609d3379b9d211d
          MSPEC_REV: dffcdf7d00612c13465983224203e457a30cf124
        run: |
          git init ../spec
          git -C ../spec fetch --depth 1 https://github.com/ruby/spec.git "$SPEC_REV"
          git -C ../spec checkout FETCH_HEAD
          git init ../mspec
          git -C ../mspec fetch --depth 1 https://github.com/ruby/mspec.git "$MSPEC_REV"
          git -C ../mspec checkout FETCH_HEAD
      - name: Clone ruby-bench
        run: git clone --depth 1 https://github.com/ruby/ruby-bench.git ../ruby-bench
      - name: Pre-build test + benchmark binaries
        run: |
          cargo nextest run --no-run --features stress-spill-pool,gc-stress
          cargo build --bin monoruby --features stress-spill-pool,gc-stress
      - name: Loop bin/test under a memory watchdog (find the OOM culprit)
        # Same instrumentation as the rust.yml darwin Test step, in a loop:
        #   * MONORUBY_MALLOC_HARD_LIMIT — a runaway Rust-side allocation
        #     aborts with a size report + backtrace instead of OOM-killing
        #     the runner (and nextest names the aborted test);
        #   * a `darwin-hang-debug-heartbeat` check run PATCHed every ~30 s
        #     with memory/disk state, the command lines of in-flight test
        #     processes (nextest passes the test name in argv), and any
        #     watchdog forensics — it survives runner death, which erases
        #     the streamed log (confirmed on every 2026-07-26 incident);
        #   * the widened watchdog (monoruby AND ruby processes, plus a
        #     system-free-memory floor) that samples + kills the culprit.
        env:
          ITERATIONS: ${{ github.event.inputs.iterations }}
          TEST_THREADS: ${{ github.event.inputs.test_threads }}
          RSS_LIMIT_KB: ${{ github.event.inputs.rss_limit_kb }}
          SUM_LIMIT_KB: ${{ github.event.inputs.sum_limit_kb }}
          MEM_LIMIT_KB: ${{ github.event.inputs.mem_limit_kb }}
          MONORUBY_MALLOC_HARD_LIMIT: 3G
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          set -o pipefail

          if [ "${MEM_LIMIT_KB}" -gt 0 ] 2>/dev/null; then
            ulimit -v "${MEM_LIMIT_KB}" 2>/dev/null \
              && echo "ulimit -v set to ${MEM_LIMIT_KB} KB" \
              || echo "ulimit -v not enforceable here (expected on macOS)"
          fi
          echo "effective ulimit -v: $(ulimit -v) | per-proc RSS cap=${RSS_LIMIT_KB}KB sum cap=${SUM_LIMIT_KB}KB | malloc hard limit=$MONORUBY_MALLOC_HARD_LIMIT"

          CURLOG="$RUNNER_TEMP/current-iteration.log"
          FORENSICS="$RUNNER_TEMP/watchdog-forensics.log"
          CR_ID_FILE="$RUNNER_TEMP/hb-checkrun-id"
          SYS_FREE_FLOOR_KB=700000

          hb_post() {
            [ -n "${GH_TOKEN:-}" ] || return 0
            if [ ! -s "$CR_ID_FILE" ]; then
              curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
                -d "{\"name\":\"darwin-hang-debug-heartbeat\",\"head_sha\":\"$GITHUB_SHA\",\"status\":\"completed\",\"conclusion\":\"neutral\"}" \
                | jq -r '.id // empty' > "$CR_ID_FILE" 2>/dev/null || true
            fi
            hbid=$(cat "$CR_ID_FILE" 2>/dev/null || true)
            [ -n "$hbid" ] || return 0
            { echo '### in-flight monoruby/ruby processes (nextest passes the test name in argv)'
              echo '```'
              ps -Ao pid,rss,etime,command | awk 'NR>1 { n=split($4,a,"/"); b=a[n]; if (b ~ /^(monoruby|ruby)/) print }' | head -30
              echo '```'
              if [ -s "$FORENSICS" ]; then
                echo '### watchdog forensics'; echo '```'; tail -c 18000 "$FORENSICS"; echo '```'
              fi
              echo '### bin/test log tail'; echo '```'; tail -n 100 "$CURLOG" 2>/dev/null || true; echo '```'
            } > "$RUNNER_TEMP/hb-body.md"
            jq -n --arg s "$1" --rawfile t "$RUNNER_TEMP/hb-body.md" \
              '{output:{title:"darwin-hang-debug heartbeat (survives runner death)",summary:$s,text:($t|.[0:60000])}}' \
              | curl -sf -X PATCH -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs/$hbid" \
                  -d @- > /dev/null 2>&1 || true
          }

          watchdog() {
            t0=$(date +%s); pass=0
            while true; do
              snap=$(ps -Ao pid,rss,comm \
                | awk 'NR>1 { n=split($3,a,"/"); b=a[n]; if (b ~ /^(monoruby|ruby)/) print $1, $2, b }')
              sum=0; toppid=0; toprss=0; topcmd=-
              if [ -n "$snap" ]; then
                sum=$(echo "$snap" | awk '{s+=$2} END{print s+0}')
                set -- $(echo "$snap" | awk '{if($2>m){m=$2;p=$1;c=$3}} END{print p+0, m+0, c}')
                toppid=$1; toprss=$2; topcmd=${3:--}
              fi
              freekb=$(vm_stat | awk -F'[: .]+' \
                '/Pages free/ {f=$3} /Pages inactive/ {i=$3} /Pages purgeable/ {p=$3} END {print (f+i+p)*16}')
              if [ "${toprss:-0}" -gt "${RSS_LIMIT_KB}" ] || [ "${sum:-0}" -gt "${SUM_LIMIT_KB}" ] \
                 || { [ "${freekb:-999999999}" -lt "$SYS_FREE_FLOOR_KB" ] && [ "${toppid:-0}" -gt 0 ]; }; then
                { echo "==================== MEMORY WATCHDOG fired @ $(date -u +%H:%M:%S) ===================="
                  echo "sys_free_kb=$freekb sum_rss_kb=$sum top=$topcmd pid=$toppid rss_kb=$toprss"
                  echo "---- watched processes (pid rss_kb etime command) ----"
                  ps -Ao pid,rss,etime,command | awk 'NR>1 { n=split($4,a,"/"); b=a[n]; if (b ~ /^(monoruby|ruby)/) print }'
                  echo "---- CULPRIT command line (pid $toppid) ----"
                  ps -p "$toppid" -o command= 2>/dev/null || true
                  echo "---- sample pid $toppid (2s) ----"
                  /usr/bin/sample "$toppid" 2 2>&1 | sed -n '1,160p' || true
                  echo "---- killing pid $toppid ----"
                  kill -9 "$toppid" 2>/dev/null || true
                } 2>&1 | tee -a "$FORENSICS"
                hb_post "WATCHDOG FIRED $(date -u +%H:%M:%S): top=$topcmd rss_kb=${toprss:-0} sys_free_kb=${freekb:-?}"
                sleep 8
              fi
              pass=$((pass+1))
              if [ $((pass % 8)) -eq 0 ]; then
                gtop=$(ps -Ao pid,rss,comm -m 2>/dev/null | awk 'NR==2 {n=split($3,a,"/"); print a[n]"("$2"KB)"}')
                diskfree=$(df -k / 2>/dev/null | awk 'NR==2 {print $4}')
                hbline=$(printf '[hb %s +%ss] iter=%s sys_free_kb=%s disk_free_kb=%s watched_sum_kb=%s top=%s(%sKB) global_top=%s' \
                  "$(date -u +%H:%M:%S)" "$(( $(date +%s) - t0 ))" "$(cat "$RUNNER_TEMP/iter" 2>/dev/null || echo 0)" \
                  "${freekb:-?}" "${diskfree:-?}" "$sum" "$topcmd" "${toprss:-0}" "${gtop:--}")
                echo "$hbline"
                hb_post "$hbline"
              fi
              sleep 4
            done
          }
          watchdog &
          WATCH=$!
          trap 'kill "$WATCH" 2>/dev/null || true' EXIT

          [ -n "${TEST_THREADS}" ] && export NEXTEST_TEST_THREADS="${TEST_THREADS}"

          for i in $(seq 1 "${ITERATIONS}"); do
            echo "$i" > "$RUNNER_TEMP/iter"
            echo "==================== bin/test iteration $i / ${ITERATIONS} ===================="
            if ! bin/test 2>&1 | tee "$CURLOG"; then
              echo "bin/test iteration $i failed — check the MEMORY WATCHDOG block / hard-limit"
              echo "abort report / nextest failure summary above for the culprit's name."
              hb_post "ITERATION $i FAILED $(date -u +%H:%M:%S) — see forensics/log tail"
              exit 1
            fi
          done
          echo "no hang reproduced in ${ITERATIONS} bin/test iterations"
          hb_post "COMPLETED: no hang in ${ITERATIONS} iterations"
