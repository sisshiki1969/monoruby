<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>monoruby profile</title>
<!--
  The viewer of monoruby's built-in profiler (doc/profiler.md).

  `MONORUBY_PROF_OUT=PREFIX` writes this page as PREFIX.html with the run's
  data in the `data` script element below. Everything is in this one file:
  no network, no dependency. The data is the stacks themselves (see `View`
  in src/prof.rs for the format), and every table and chart here is
  computed from them, so that they can be recomputed for a part of the run.
-->
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --frame: #e9e8e2; --frame-native: #d5d3c8; --frame-dim: #f0efea; --tier-dim: #dcdbd3;
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.12);
  --t0: #2a78d6; --t1: #eb6834; --t2: #1baf7a; --t3: #eda100; --t4: #e87ba4;
  --t5: #008300; --t6: #6250d6; --t7: #e34948; --t8: #898781; --t9: #c3c2b7;
  --on-t3: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --frame: #33332f; --frame-native: #4a4943; --frame-dim: #262624; --tier-dim: #3a3a37;
    --accent: #3987e5; --accent-wash: rgba(57,135,229,.18);
    --t0: #3987e5; --t1: #d95926; --t2: #199e70; --t3: #c98500; --t4: #d55181;
    --t5: #0ca30c; --t6: #9085e9; --t7: #e66767; --t8: #898781; --t9: #55544f;
    --on-t3: #ffffff;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
  --frame: #33332f; --frame-native: #4a4943; --frame-dim: #262624; --tier-dim: #3a3a37;
  --accent: #3987e5; --accent-wash: rgba(57,135,229,.18);
  --t0: #3987e5; --t1: #d95926; --t2: #199e70; --t3: #c98500; --t4: #d55181;
  --t5: #0ca30c; --t6: #9085e9; --t7: #e66767; --t8: #898781; --t9: #55544f;
  --on-t3: #ffffff;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 16px 20px 48px; }
header.top { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
header.top h1 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
header.top .cmd { color: var(--ink2); word-break: break-all; }
header.top .info { color: var(--muted); margin-top: 2px; }
header.top .grow { flex: 1; min-width: 0; }
button, select, input[type="search"] {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; height: 28px;
}
button { cursor: pointer; }
button:hover { background: var(--wash); }
input[type="search"] { min-width: 220px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; font-weight: 650; margin: 0; }
.card .cap { color: var(--muted); margin: 2px 0 8px; max-width: 110ch; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row .grow { flex: 1; }
.muted { color: var(--muted); }
.warn { border-left: 3px solid #fab219; padding: 6px 10px; margin-bottom: 12px; background: var(--surface); border-radius: 4px; }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 4px 0 12px; flex-wrap: wrap; }
nav.tabs button { border: 0; background: none; border-radius: 6px 6px 0 0; height: 32px; padding: 4px 14px; color: var(--ink2); border-bottom: 2px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }
.legend { display: flex; gap: 4px 14px; flex-wrap: wrap; color: var(--ink2); margin: 6px 0 2px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend button { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border: 0; background: none; height: 24px; padding: 2px 6px; margin: 0 -6px; color: inherit; }
.legend button:hover { background: var(--wash); }
.legend button[aria-pressed="true"] { color: var(--ink); font-weight: 650; }
.legend.only button[aria-pressed="false"] { color: var(--muted); }
.legend.only button[aria-pressed="false"] .sw { background: var(--tier-dim) !important; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
canvas { display: block; width: 100%; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.tile .l { color: var(--ink2); }
.tile .v { font-size: 22px; font-weight: 650; line-height: 1.25; }
.tile .s { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 12px; }
.grid2 > .card { margin-bottom: 0; min-width: 0; }
.grid2 { margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--ink2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--surface); user-select: none; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
th .arrow { color: var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td { white-space: nowrap; }
td.name { white-space: normal; overflow-wrap: anywhere; min-width: 160px; }
td.short { min-width: 0; white-space: nowrap; }
td .loc { color: var(--muted); margin-left: 6px; white-space: nowrap; }
tbody tr:hover { background: var(--wash); }
tbody tr.sel { background: var(--accent-wash); }
tbody tr.click { cursor: pointer; }
.barcell { width: 96px; min-width: 96px; }
.bar { height: 8px; border-radius: 4px; background: var(--wash); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.mix { display: flex; gap: 1px; height: 8px; border-radius: 4px; overflow: hidden; width: 96px; }
.mix > i { display: block; height: 100%; min-width: 1px; }
.tablewrap { max-height: 70vh; overflow: auto; }
.more { margin-top: 8px; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
.split > .card { margin-bottom: 0; }
.detail h3 { font-size: 13px; margin: 12px 0 4px; font-weight: 650; }
.detail .big { font-weight: 650; font-size: 14px; word-break: break-word; }
#tip {
  position: fixed; z-index: 10; pointer-events: none; max-width: 520px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 18px rgba(0,0,0,.18);
}
#tip .h { font-weight: 650; word-break: break-word; }
#tip .sub { color: var(--muted); word-break: break-all; }
#tip .kv { display: grid; grid-template-columns: auto auto 1fr; gap: 0 8px; margin-top: 4px; align-items: center; }
#tip .kv b { text-align: right; font-variant-numeric: tabular-nums; }
#tip .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
.crumbs { color: var(--ink2); margin: 6px 0; min-height: 20px; word-break: break-word; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.flamebox { position: relative; }
.flamebox canvas { cursor: pointer; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; height: 26px; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); font-weight: 650; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="grow">
      <h1>monoruby profile</h1>
      <div class="cmd mono" id="cmd"></div>
      <div class="info" id="info"></div>
    </div>
    <button id="theme" title="Switch between the system's, the light and the dark theme">Theme: auto</button>
  </header>
  <div id="warnings"></div>
  <section class="card" id="tl-card" hidden>
    <div class="row">
      <h2>Time line</h2>
      <span class="muted" id="tl-hint">Share of each bucket's CPU samples by tier. Drag to look at a part of the run; everything below follows. Click a tier in the legend to pick it out.</span>
      <span class="grow"></span>
      <span id="tl-range" class="mono"></span>
      <button id="tl-reset" hidden>Whole run</button>
    </div>
    <div class="legend" id="tl-legend"></div>
    <canvas id="tl" height="150" tabindex="0" aria-label="Time line of CPU samples by tier"></canvas>
  </section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="tip" hidden></div>
<script id="data" type="application/json">/*MONORUBY_PROF_DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const M = D.meta;
const NB = Math.max(1, M.buckets | 0);
const NT = D.tiers.length;
// One CPU sample's worth of the sampled clock, in ms.
const SPAN = M.clock === "wall" ? M.wall : M.cpuTime;
const MS_PER_SAMPLE = M.samples ? SPAN * 1000 / M.samples : 0;

//
// Small helpers
//
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtInt = (n) => Math.round(n).toLocaleString("en-US");
const fmtPct = (n, total) => total ? (n * 100 / total).toFixed(1) + "%" : "–";
function fmtCompact(n) {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "G";
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(1) + "K";
  return fmtInt(n);
}
function fmtBytes(n) {
  const a = Math.abs(n);
  if (a >= 1 << 30) return (n / (1 << 30)).toFixed(2) + " GiB";
  if (a >= 1 << 20) return (n / (1 << 20)).toFixed(2) + " MiB";
  if (a >= 1 << 10) return (n / (1 << 10)).toFixed(1) + " KiB";
  return fmtInt(n) + " B";
}
function fmtMs(ms) {
  if (ms >= 1000) return (ms / 1000).toFixed(ms >= 10000 ? 1 : 2) + " s";
  if (ms >= 1) return ms.toFixed(ms >= 100 ? 0 : 1) + " ms";
  return (ms * 1000).toFixed(0) + " µs";
}
const fmtNs = (ns) => fmtMs(ns / 1e6);
function basename(loc) {
  const i = loc.lastIndexOf("/");
  return i < 0 ? loc : loc.slice(i + 1);
}

//
// Profiles: the stacks of one kind of event
//
// A stack is `head` words, the number of frameless-inlined frames at its
// top, and its Ruby frames, oldest first. A bucket is a flat list of
// (stack, count) pairs, or (stack, count, weight) triples.
//
const PROFILES = {
  cpu: { src: D.cpu, head: 3, stride: 2, on: M.modes.cpu && D.cpu.stacks.length > 0 },
  alloc: { src: D.alloc, head: 1, stride: 2, on: M.modes.alloc && D.alloc.stacks.length > 0 },
  malloc: { src: D.malloc, head: 1, stride: 3, on: M.modes.malloc && D.malloc.stacks.length > 0 },
};
// What a view can be about.
const METRICS = {
  cpu: {
    label: "CPU time", profile: "cpu", weight: false, unit: "samples",
    fmt: (n) => fmtInt(n), detail: (n) => fmtInt(n) + " samples · " + fmtMs(n * MS_PER_SAMPLE),
  },
  alloc: {
    label: "Objects allocated", profile: "alloc", weight: false, unit: "objects",
    fmt: (n) => fmtInt(n), detail: (n) => "≈ " + fmtInt(n) + " objects",
  },
  mcalls: {
    label: "malloc calls", profile: "malloc", weight: false, unit: "calls",
    fmt: (n) => fmtInt(n), detail: (n) => "≈ " + fmtInt(n) + " calls",
  },
  mbytes: {
    label: "malloc bytes", profile: "malloc", weight: true, unit: "bytes",
    fmt: (n) => fmtBytes(n), detail: (n) => "≈ " + fmtBytes(n),
  },
};
const metricKeys = () => Object.keys(METRICS).filter((k) => PROFILES[METRICS[k].profile].on);

const state = {
  tab: null,
  range: [0, NB],          // buckets [a, b)
  metric: null,
  flame: { reverse: false, search: "", zoom: null },
  methods: { selected: null, filter: "" },
};
const ranged = () => state.range[0] !== 0 || state.range[1] !== NB;

// The value of every stack of *metric* in the selected range.
const valueCache = new Map();
function values(metricKey) {
  const key = metricKey + "|" + state.range;
  let v = valueCache.get(key);
  if (v) return v;
  const m = METRICS[metricKey], p = PROFILES[m.profile];
  v = new Float64Array(p.src.stacks.length);
  const off = m.weight ? 2 : 1;
  const hi = Math.min(state.range[1], p.src.buckets.length);
  for (let b = state.range[0]; b < hi; b++) {
    const row = p.src.buckets[b];
    for (let i = 0; i < row.length; i += p.stride) v[row[i]] += row[i + off];
  }
  if (valueCache.size > 12) valueCache.clear();
  valueCache.set(key, v);
  return v;
}
const sum = (a) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };

// Frames: a key packs what a frame is and its index.
const K = { RUBY: 0, INLINED: 1, TIER: 2, SYM: 3, CLASS: 4, SITE: 5 };
const KSHIFT = 1 << 24;
const kkind = (k) => Math.floor(k / KSHIFT), kid = (k) => k % KSHIFT;
const frameCache = {};
// The frames of every stack of a profile, root first, with the leaves that
// say what the sample was (tier and native function; class; call site).
function framesOf(profile) {
  if (frameCache[profile]) return frameCache[profile];
  const p = PROFILES[profile];
  const out = p.src.stacks.map((s) => {
    const ninl = s[p.head], n = s.length - p.head - 1, f = [];
    for (let i = 0; i < n; i++) {
      f.push((i >= n - ninl ? K.INLINED : K.RUBY) * KSHIFT + s[p.head + 1 + i]);
    }
    if (profile === "cpu") {
      f.push(K.TIER * KSHIFT + s[0]);
      if (s[1] >= 0) f.push(K.SYM * KSHIFT + s[1]);
    } else if (profile === "alloc") {
      f.push(K.CLASS * KSHIFT + s[0]);
    } else {
      f.push(K.SITE * KSHIFT + s[0]);
    }
    return f;
  });
  return frameCache[profile] = out;
}
function frameName(k) {
  const id = kid(k);
  switch (kkind(k)) {
    case K.RUBY: return D.funcs[id][0];
    case K.INLINED: return D.funcs[id][0] + " [inlined]";
    case K.TIER: return "[" + D.tiers[id][1] + "]";
    case K.SYM: case K.SITE: return D.syms[id];
    case K.CLASS: return D.classes[id];
  }
  return "?";
}
function frameSub(k) {
  const id = kid(k);
  switch (kkind(k)) {
    case K.RUBY: return D.funcs[id][1] || "native method";
    case K.INLINED: return (D.funcs[id][1] || "native method") + " · inlined without a frame";
    case K.TIER: return "tier: where the PC was, or the runtime phase";
    case K.SYM: return "Rust / C function the PC was in";
    case K.SITE: return "Rust / C function that asked for the memory";
    case K.CLASS: return "class of the allocated object";
  }
  return "";
}
// The newest Ruby frame of a stack (-1: none) and its function.
function leafFunc(profile, s) {
  const p = PROFILES[profile];
  return s.length > p.head + 1 ? s[s.length - 1] : -1;
}
function funcLabel(f) { return f < 0 ? "(no Ruby frame)" : D.funcs[f][0]; }
function funcNode(f) {
  const td = el("td", { class: "name" });
  td.append(funcLabel(f));
  if (f >= 0) {
    const loc = D.funcs[f][1];
    td.append(el("span", { class: "loc", text: loc ? basename(loc) : "native", title: loc || "a method implemented in Rust" }));
  }
  return td;
}

//
// Tooltip
//
const tip = document.getElementById("tip");
function showTip(ev, build) {
  tip.replaceChildren();
  build(tip);
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 16;
  if (x + r.width > innerWidth - 8) x = Math.max(8, ev.clientX - r.width - 14);
  if (y + r.height > innerHeight - 8) y = Math.max(8, ev.clientY - r.height - 12);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
function tipRows(parent, rows) {
  const kv = el("div", { class: "kv" });
  for (const [color, value, label] of rows) {
    kv.append(color ? el("i", { class: "key", style: "background:" + color }) : el("i"),
      el("b", { text: value }), el("span", { text: label }));
  }
  parent.append(kv);
}

//
// Tables
//
// cols: { label, get(row) -> sortable value, fmt(value,row) -> text,
//         cell(row) -> td (instead of fmt), num, bar: {max, color(row)}, title }
const sortState = {};
function makeTable(id, cols, rows, opts = {}) {
  const st = sortState[id] || (sortState[id] = { col: opts.sort ?? 0, dir: -1, limit: opts.limit ?? 200 });
  const wrap = el("div");
  const draw = () => {
    const c = cols[st.col];
    const sorted = rows.slice().sort((a, b) => {
      const x = c.get(a), y = c.get(b);
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * st.dir;
    });
    const thead = el("tr");
    cols.forEach((col, i) => {
      const th = el("th", { class: (col.num ? "num " : "") + (col.get ? "sortable" : ""), title: col.title });
      th.append(col.label);
      if (i === st.col) th.append(el("span", { class: "arrow", text: st.dir < 0 ? " ▾" : " ▴" }));
      if (col.get) th.addEventListener("click", () => {
        if (st.col === i) st.dir = -st.dir; else { st.col = i; st.dir = col.num ? -1 : 1; }
        draw();
      });
      thead.append(th);
      if (col.bar) thead.append(el("th"));
    });
    const tbody = el("tbody");
    for (const r of sorted.slice(0, st.limit)) {
      const tr = el("tr", { class: (opts.onRow ? "click " : "") + (opts.selected && opts.selected(r) ? "sel" : "") });
      if (opts.onRow) tr.addEventListener("click", () => opts.onRow(r));
      for (const col of cols) {
        if (col.cell) tr.append(col.cell(r));
        else tr.append(el("td", { class: col.num ? "num" : col.wrap ? "name" : "", text: col.fmt ? col.fmt(col.get(r), r) : col.get(r) }));
        if (col.bar) {
          const w = col.bar.max ? Math.max(0, Math.min(100, col.get(r) * 100 / col.bar.max)) : 0;
          const i = el("i", { style: "width:" + w.toFixed(2) + "%" + (col.bar.color ? ";background:" + col.bar.color(r) : "") });
          tr.append(el("td", { class: "barcell" }, el("div", { class: "bar" }, i)));
        }
      }
      tbody.append(tr);
    }
    const t = el("table", null, el("thead", null, thead), tbody);
    wrap.replaceChildren(el("div", { class: "tablewrap" }, t));
    if (!rows.length) wrap.append(el("div", { class: "empty", text: opts.empty || "Nothing recorded." }));
    if (sorted.length > st.limit) {
      wrap.append(el("button", {
        class: "more", text: "Show all " + fmtInt(sorted.length) + " rows",
        onclick: () => { st.limit = Infinity; draw(); },
      }));
    }
  };
  draw();
  return wrap;
}
function card(title, caption, ...body) {
  const c = el("section", { class: "card" });
  if (title) c.append(el("h2", { text: title }));
  if (caption) c.append(el("div", { class: "cap", text: caption }));
  c.append(...body);
  return c;
}
function tile(label, value, sub) {
  return el("div", { class: "tile" }, el("div", { class: "l", text: label }),
    el("div", { class: "v", text: value }), sub ? el("div", { class: "s", text: sub }) : null);
}
function metricSelect(onchange) {

function relatives(metricKey, f) {
  const m = METRICS[metricKey], p = PROFILES[m.profile], v = values(metricKey);
  const callers = new Map(), callees = new Map(), leaves = new Map();
  p.src.stacks.forEach((s, i) => {
    const w = v[i];
    if (!w) return;
    const first = p.head + 1;
    const seenUp = new Set(), seenDown = new Set();
    for (let j = first; j < s.length; j++) {
      if (s[j] !== f) continue;
      const up = j > first ? s[j - 1] : -1;
      if (!seenUp.has(up)) { seenUp.add(up); callers.set(up, (callers.get(up) || 0) + w); }
      if (j + 1 < s.length) {
        const down = s[j + 1];
        if (!seenDown.has(down)) { seenDown.add(down); callees.set(down, (callees.get(down) || 0) + w); }
      }
    }
    if (leafFunc(m.profile, s) === f) {
      const leaf = m.profile === "cpu" ? (s[1] >= 0 ? D.syms[s[1]] : "[" + D.tiers[s[0]][1] + "]")
        : m.profile === "alloc" ? D.classes[s[0]] : D.syms[s[0]];
      leaves.set(leaf, (leaves.get(leaf) || 0) + w);
    }
  });
  const list = (map) => [...map].map(([k, n]) => ({ k, n })).sort((a, b) => b.n - a.n);

}

  const T = D.mallocTotals;
  root.append(el("div", { class: "tiles" },
    tile("malloc calls", fmtCompact(T.calls), fmtInt(T.calls) + ", whole run"),
    tile("Requested", fmtBytes(T.bytes), T.calls ? fmtBytes(T.bytes / T.calls) + " per call" : ""),
    tile("free calls", fmtCompact(T.frees), fmtInt(T.frees) + ", whole run"),
    tile("Freed", fmtBytes(T.freeBytes), "still held: " + fmtBytes(Math.max(0, T.bytes - T.freeBytes)))));
  if (!PROFILES.malloc.on) return;
  const calls = values("mcalls"), bytes = values("mbytes");
  const byFunc = new Map(), bySite = new Map();
  let all = 0;
  D.malloc.stacks.forEach((s, i) => {
    if (!calls[i]) return;
    all += calls[i];
    for (const [map, key] of [[byFunc, leafFunc("malloc", s)], [bySite, s[0]]]) {
      const e = map.get(key) || { k: key, calls: 0, bytes: 0 };
      e.calls += calls[i]; e.bytes += bytes[i];
      map.set(key, e);
    }
  });
  const cols = (first) => [first,
    { label: "Calls", num: true, get: (r) => r.calls, fmt: fmtInt },
    { label: "%", num: true, get: (r) => r.calls, fmt: (n) => fmtPct(n, all) },
    { label: "Bytes", num: true, get: (r) => r.bytes, fmt: fmtBytes, bar: { max: 0 } },
  ];
  const note = " Estimates from the stacks recorded for one call in " + T.every + "." + rangeNote();
  const mk = (id, first, map) => {
    const rows = [...map.values()], c = cols(first);
    c[3].bar.max = Math.max(0, ...rows.map((r) => r.bytes));
    return makeTable(id, c, rows, { sort: 1, limit: 100 });
  };
  const grid = el("div", { class: "grid2" });
  grid.append(card("malloc by Ruby method",
    "Allocations by the newest Ruby frame when malloc was called. (no Ruby frame): the boot, before any Ruby code runs." + note,
    mk("mfunc", { label: "Method", get: (r) => funcLabel(r.k), cell: (r) => funcNode(r.k) }, byFunc)));
  grid.append(card("malloc by Rust call site",
    "Allocations by the innermost native caller that is not allocator plumbing (alloc::, core::, std::, hashbrown::, smallvec::, … are skipped)." + note,
    mk("msite", { label: "Function", get: (r) => D.syms[r.k], cell: (r) => el("td", { class: "name mono", text: D.syms[r.k] }) }, bySite)));
  root.append(grid);
}

//
// Shell
//
const TABS = [
  ["overview", "Overview", viewOverview, () => true],
  ["flame", "Flame graph", viewFlame, () => metricKeys().length > 0],
  ["methods", "Methods", viewMethods, () => metricKeys().length > 0],
  ["native", "Native functions", viewNative, () => PROFILES.cpu.on],
  ["jit", "JIT", viewJit, () => !!D.jit],
  ["objects", "Objects & GC", viewObjects, () => !!D.objects],
  ["malloc", "malloc", viewMalloc, () => !!D.mallocTotals],
];
function render() {
  hideTip();
  flame.canvas = null;
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren();
  for (const [id, label, , on] of TABS) {
    if (!on()) continue;
    tabs.append(el("button", { role: "tab", "aria-selected": String(id === state.tab), text: label, onclick: () => go(id) }));
  }
  const view = document.getElementById("view");
  view.replaceChildren();
  const tab = TABS.find((t) => t[0] === state.tab) || TABS[0];
  tab[2](view);
}
function go(tab) {
  state.tab = tab;
  try { history.replaceState(null, "", "#" + tab); } catch (e) { /* file: pages may refuse */ }
  render();
  window.scrollTo({ top: Math.min(window.scrollY, document.getElementById("tabs").offsetTop - 8) });
}
function initTheme() {
  const btn = document.getElementById("theme"), order = ["auto", "light", "dark"];
  let cur = "auto";
  try { cur = localStorage.getItem("monoruby-prof-theme") || "auto"; } catch (e) { /* no storage */ }
  const apply = () => {
    if (cur === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", cur);
    btn.textContent = "Theme: " + cur;
    drawTimeline(); drawFlame();
  };
  btn.addEventListener("click", () => {
    cur = order[(order.indexOf(cur) + 1) % order.length];
    try { localStorage.setItem("monoruby-prof-theme", cur); } catch (e) { /* no storage */ }
    apply(); render();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawTimeline(); drawFlame(); });
  apply();
}
function init() {
  document.title = "monoruby profile: " + M.command.split(" ").slice(1).join(" ");
  document.getElementById("cmd").textContent = M.command;
  const modes = Object.keys(M.modes).filter((k) => M.modes[k]).join(", ");
  document.getElementById("info").textContent =
    "monoruby " + M.monoruby + " (" + M.target + ") · " + (M.epoch ? new Date(M.epoch * 1000).toLocaleString() + " · " : "") +
    "MONORUBY_PROF=" + modes + (M.modes.cpu ? " · " + M.hz + " Hz, " + M.clock + " clock" : "") +
    (M.inline ? " · frameless-inlined callees shown as frames" : "");
  const warn = document.getElementById("warnings");
  if (M.dropped) warn.append(el("div", { class: "warn", text: fmtInt(M.dropped) + " samples were dropped: the sample buffer was full (raise MONORUBY_PROF_BUF_MB)." }));
  if (M.modes.cpu && M.modes.alloc) warn.append(el("div", { class: "warn", text: "Objects were counted in this run, which turns the JIT's inline allocation off: the CPU times are not representative. Profile cpu in a run of its own for timings." }));
  state.metric = metricKeys()[0] || null;
  const want = location.hash.slice(1);
  state.tab = TABS.some((t) => t[0] === want && t[3]()) ? want : "overview";
  initTimeline();
  initTheme();
  render();
  new ResizeObserver(() => { drawTimeline(); drawFlame(); }).observe(document.querySelector(".wrap"));
}
init();
</script>
