[package]
name = "monoruby"
version = "0.3.0"
authors = ["monochrome <sisshiki@mac.com>"]
description = "another CRuby implementation with JIT compiler."
repository = "https://github.com/sisshiki1969/monoruby"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "monoruby"
build = "build.rs"

[[bin]]
name = "monoruby"

[[bin]]
name = "irm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
dump-bc = []
dump-traceir = []
emit-asm = ["dump-bc", "dump-traceir", "jit-log"]
emit-bc = ["dump-bc", "dump-traceir"]
jit-log = []
jit-debug = ["dump-traceir"]
deopt = ["jit-log", "dump-bc", "dump-traceir"]
gc-log = []
gc-debug = []
gc-stress = []
# After every minor GC, independently re-mark the whole live graph from
# the roots. If the minor collection freed anything still reachable
# (a missed write barrier / remembered-set entry), the traversal hits a
# freed slot and the is_live assertion in RValue::mark fires. Debug-only;
# very slow. See doc/generational_gc_plan.md.
gc-verify = []
# Force PHYS_XMM_POOL down to 2 so almost every Float-resident slot
# becomes a spilled VirtFPReg. Used in CI to stress-test the spill
# code paths (LoadSpill / StoreSpill, spill-aware AsmInst lowerings,
# 16-byte spill-region alignment).
stress-spill-pool = []
# Counters only: `profile` needs `TraceIr::format` for its deopt-site table,
# not the bytecode dumps `dump-bc` brings.
profile = ["dump-traceir"]
# Trace every chain-deopt escalation to stderr. Opt-in, and deliberately not
# implied by `deopt` / `profile`: escalation is a per-side-exit runtime
# operation rather than a per-deopt event, and it fires hundreds of thousands
# of times per activerecord iteration. Logging it unconditionally in `deopt`
# builds wrote 160 MB of stderr in five iterations and made those builds 7x
# slower than release, hiding the very costs a measurement build should show.
chain-deopt-log = []
# Route `RurubyAlloc`'s delegation to mimalloc instead of the system (glibc)
# allocator. Everything else — the MALLOC_AMOUNT accounting, the GC trigger,
# the hard limit — is unchanged, so an A/B against a default build varies
# exactly one thing. Motivated by the activerecord profile: 582k allocs +
# 582k frees per steady iteration, 18% of CPU inside glibc (half of it in
# free-side consolidate/unlink, which mimalloc's design does not have).
mimalloc = ["dep:mimalloc"]
perf = []
# §5 Layer-② extraction: stage-1 *placement shadow*. Records, in emission order,
# every physical FP placement that ③ commits (one entry per `PhysMap::resolve`),
# producing a per-`jit_compile` fingerprint of the FPReg→FPRegLoc lowering. The
# P2/P3 separation (① virtual-reg assignment vs ② physical allocation) is gated
# on this fingerprint staying byte-identical between the baseline greedy
# allocator and the separated ②. Default-off; zero cost in shipping builds.
shadow-placement = []
# §5 Layer-② extraction, step P2: relocate the physical FP-placement *policy*
# (pool-vs-spill) out of ③ (`PhysMap::resolve`) into an explicit ②
# (`codegen::phys_alloc`) table-backed function, leaving ③ policy-free (look up
# the virtual fpr's physical slot, apply the frame base). Byte-identical to the
# formula it replaces (verified via `shadow-placement` digests); the seam where
# P4's loop-aware allocator swaps in. Default-off until the M1 A/B gate clears.
phys-table = []
emit-cfg = ["dump-bc", "dump-traceir"]
dump-require = []

# Which C library each extension that carries one is built against.
# `build.rs` installs the five extensions from Cargo's own artifact
# dependencies (below), so this is where the choice `bin/install`'s
# MONORUBY_SYSTEM_LIBS used to make per `cargo build -p` invocation now
# lives. Cargo features only ever add, so `bundled` and `system` are a
# pair per extension and the artifact dependency takes
# `default-features = false`: selecting `system` means
# `--no-default-features --features "system-zlib,bundled-sqlite3,…"`,
# which `bin/install` composes. psych and nokogiri have no such choice
# (a Rust port, and a patched libxml2 the FFI mirrors).
default = ["bundled-sqlite3", "bundled-zlib", "bundled-zstd"]
bundled-sqlite3 = ["sqlite3_native/bundled"]
system-sqlite3 = ["sqlite3_native/system"]
bundled-zlib = ["zlib_native/bundled"]
system-zlib = ["zlib_native/system"]
bundled-zstd = ["zstd_native/bundled"]
system-zstd = ["zstd_native/system"]

[dependencies]
# Phase-1 locality experiment: size-class-segregated backend for the global
# allocator (see the `mimalloc` feature below). Optional; default builds
# keep the system allocator.
mimalloc = { version = "0.1", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
rustyline = "18.0.0"
paste = "1.0.15"
monoasm_macro = { git = "https://github.com/sisshiki1969/monoasm.git", branch = "aarch" }
monoasm = { git = "https://github.com/sisshiki1969/monoasm.git", branch = "aarch" }
onigmo-regex = { git = "https://github.com/sisshiki1969/onigmo-regex.git" }
ruby-prism = { git = "https://github.com/sisshiki1969/prism.git", branch = "monoruby-vendored" }
monoruby-attr = { path = "../monoruby_attr" }
# The C ABI handed to dynamically loaded extensions (src/ext.rs).
monoruby-ext-sys = { path = "../monoruby_ext_sys" }
rubymap = { path = "../rubymap" }
indexmap = "2.14.0"
num = "0.4.3"
console = "0.15.11"
fxhash = "0.2.1"
memchr = "2"
tempfile = "3.27.0"
# The interpreter-free half of the test harness. `tests` is part of this
# lib (integration tests import it), so this is a normal dependency.
monoruby_test_support = { path = "../monoruby_test_support" }
dtoa = "1.0.11"
chrono = "0.4.44"
encoding_rs = "0.8"
smallvec = { git = "https://github.com/sisshiki1969/rust-smallvec.git", features = [
  "const_generics",
] }
escape_string = "0.1.2"
hex = "0.4.3"
rand = "0.9.1"
regex = "1.12.3"
libc = "0.2.186"
getrandom = "0.3.3"
rand_mt = { version = "5.0.0", features = ["rand-traits"] }
bitvec = "1.0.1"
ansi_term = "0.12.1"
dirs = "6.0.0"
html-escape = "0.2.13"
unicode-general-category = "1.0.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.2"
signal-hook = "0.4.4"
divrem = "1.0.0"
libffi = "5.1.0"
# Digest builtins (`builtins/digest.rs`) — used on every platform, so these
# must stay in the cross-platform `[dependencies]`, not a target block.
# `hmac` / `pbkdf2` back `OpenSSL::HMAC` and `OpenSSL::PKCS5.pbkdf2_hmac`,
# whose per-iteration work would otherwise run as Ruby.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
bcrypt = "0.19"
comrak = { version = "0.55", default-features = false }

# macOS aarch64 (Apple Silicon): the bundled libffi-sys 4.1.0 fails to
# link `_ffi_prep_cif_machdep` (the arm64 assembly piece doesn't build
# into the static archive), so fall back to Homebrew's system libffi via
# pkg-config. Linux / x86_64 darwin keep the bundled build, matching the
# CI configuration. Install with `brew install libffi pkg-config`.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libffi = { version = "5.1.0", features = ["system"] }

[build-dependencies]
dirs = "6.0.0"

# The five dynamically loaded extensions, as *artifact* dependencies
# (`-Z bindeps`, enabled in .cargo/config.toml). Cargo builds each cdylib
# and hands `build.rs` its path in `CARGO_CDYLIB_FILE_<NAME>`, which is
# what lets the build script install them into the same root as the
# vendored stdlib — so `cargo install --path monoruby` alone produces an
# install that can `require "psych"`, instead of one that needs a second
# step to copy them. `lib = false`: the interpreter links none of them,
# it dlopens them (doc/native_extension_loading.md). `target = "target"`:
# built for the target platform, not the build host, so a cross build
# produces extensions its own binary can load.
sqlite3_native = { path = "../ext/sqlite3", artifact = "cdylib", lib = false, target = "target", default-features = false }
zlib_native = { path = "../ext/zlib", artifact = "cdylib", lib = false, target = "target", default-features = false }
zstd_native = { path = "../ext/zstd", artifact = "cdylib", lib = false, target = "target", default-features = false }
psych_native = { path = "../ext/psych", artifact = "cdylib", lib = false, target = "target" }
nokogiri_native = { path = "../ext/nokogiri", artifact = "cdylib", lib = false, target = "target" }

[dev-dependencies]
# For the integration tests that only spawn processes: importing these
# helpers from `monoruby::tests` would link the interpreter into their
# binaries for nothing.
monoruby_test_support = { path = "../monoruby_test_support" }
